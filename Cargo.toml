[package]
name = "slate_vc_server"
version = "0.1.0"
edition = "2024"

[dependencies]
async-graphql = { version = "7.2.1", features = ["chrono", "uuid"] }
async-graphql-axum = "7.2.1"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
bcrypt = "0.19.3"
dotenvy = "0.15.7"
redis = { version = "1.7.0", features = ["tokio-comp", "aio"] }
scylla = "1.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono"] }
tokio = { version = "1.53.1", features = ["full", "macros", "rt-multi-thread"] }
totp-rs = { version = "6.0.0", features = ["gen_secret"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
webrtc = "0.21.0"
